# Human listening criteria (PRD §17, ACCESSIBILITY.md).
# Only scales defined in the PRD are numeric. "TBD" criteria are shown to reviewers as
# "not collected (scale TBD)" and any submitted value is rejected.
#
# Modes:
#   blind  model identity and reference text stay hidden until the item's rating is saved.
#          Perceived intelligibility here is NOT evidence that every word was spoken.
#   text   the Tamil reference text is shown (authorized reviewers only). Completeness is
#          judged only in this mode.
criteria:
  perceived_intelligibility:
    label: "Perceived intelligibility: could you understand the speech without the text?"
    type: choice
    options: ["yes", "no", "unsure"]
    modes: [blind]
    required: true
  naturalness:
    label: "Naturalness"
    type: TBD                       # requested; no scale is defined in the PRD
    modes: [blind]
    required: false
  comfort:
    label: "Listening comfort (1 = very uncomfortable, 5 = very comfortable)"
    type: scale
    min: 1                          # PRD §17: comfort 1–5
    max: 5
    modes: [blind]
    required: true
  pronunciation:
    label: "Pronunciation accuracy: were all words pronounced correctly?"
    type: choice
    options: ["correct", "errors", "unsure"]
    modes: [text]
    required: true
  completeness:
    label: "Completeness: were all words of the text spoken, with nothing missing or cut off?"
    type: choice
    options: ["yes", "no", "unsure"]  # PRD §16: zero missing text is a hard gate
    modes: [text]
    required: true
  intelligibility:
    label: "Intelligibility with the text visible: could you follow every word?"
    type: choice
    options: ["yes", "no", "unsure"]  # aggregation unit is TBD (release_gates)
    modes: [text]
    required: true
  pronunciation_severity:
    label: "Severity of pronunciation errors"
    type: TBD                       # errors.jsonl shows "severity", but no scale is defined
    modes: [text]
    required: false
notes:
  max_chars: 1000                   # private: kept in the session, never exported
